name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install system dependencies (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb libpulse0 \
            bubblewrap systemd espeak poppler-utils
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Ensure Rust toolchain is installed
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          rustc --version
          cargo --version
      - name: Build Rust Core (mark_core)
        run: |
          VIRTUAL_ENV="$pythonLocation" maturin develop --release --manifest-path src-rust/mark_core/Cargo.toml
      - name: Run tests
        env:
          CI: true
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          PYTHONPATH: .:src
        run: |
          xvfb-run -a pytest tests/ -v

