[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "mark"
version = "0.1.0"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "src-rust/mark_core/Cargo.toml"
python-source = "src"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
    "integration: testes de integração com o motor local Ollama ou serviços reais",
]
