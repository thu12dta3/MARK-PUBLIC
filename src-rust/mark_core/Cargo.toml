[package]
name = "mark_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mark_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hkdf = "0.12.4"
sha2 = "0.10.8"
zeroize = { version = "1.8.1", features = ["derive", "zeroize_derive"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
tokio = { version = "1.35", features = ["process", "io-util", "rt-multi-thread", "sync", "macros"] }
