<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111b">
  <title>Chamada com MARK</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07111b; color: #e9faff; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #123c50 0, #091c2b 32%, #07111b 70%); }
    main { width: min(100%, 460px); min-height: 100dvh; padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 1.15rem; letter-spacing: .32em; font-weight: 600; margin: 0; color: #a6e9f4; }
    .sub { margin: 8px 0 0; opacity: .65; font-size: .85rem; text-align: center; }
    .orb { width: min(52vw, 240px); aspect-ratio: 1; border-radius: 50%; margin: auto 0 24px; display: grid; place-items: center; position: relative; box-shadow: 0 0 70px #19cde644, inset 0 0 48px #13c9e733; background: radial-gradient(circle, #b4f8ff 0 3%, #42d7e9 5% 10%, #073f5c 35%, #061927 68%); border: 2px solid #64e9fb; transition: transform .25s, box-shadow .25s; }
    .orb::before, .orb::after { content: ""; position: absolute; border-radius: 50%; inset: 12px; border: 1px solid #6ce8f499; }
    .orb::after { inset: -13px; border: 2px dashed #48d5eb66; }
    .orb.listening { animation: pulse 1.8s ease-in-out infinite; }
    .orb.speaking { box-shadow: 0 0 95px #36f1ff99, inset 0 0 50px #53e5ff66; transform: scale(1.05); }
    @keyframes pulse { 50% { box-shadow: 0 0 105px #19cde677, inset 0 0 55px #13c9e755; transform: scale(1.025); } }
    .state { min-height: 1.7em; text-align: center; font-size: 1.2rem; font-weight: 600; }
    .hint { min-height: 3em; margin: 6px 0 28px; opacity: .68; text-align: center; font-size: .9rem; }
    .key { width: 100%; max-width: 380px; margin-bottom: 18px; }
    label { display: block; font-size: .8rem; margin-bottom: 8px; opacity: .8; }
    input { width: 100%; border: 1px solid #36798b; background: #081d2b; color: #e9faff; border-radius: 12px; padding: 14px; font-size: 1rem; outline: none; }
    input:focus { border-color: #5ae8f5; }
    button { border: 0; border-radius: 999px; font: inherit; font-weight: 700; padding: 16px 32px; cursor: pointer; min-width: 190px; }
    #toggle { background: #42ddeb; color: #062230; box-shadow: 0 8px 30px #05b4d455; }
    #toggle.active { background: #e95162; color: white; box-shadow: 0 8px 30px #e9516244; }
    #interrupt { display: none; margin-top: 12px; background: #16475b; color: white; }
    #replay { display: none; margin-top: 12px; background: #16475b; color: white; }
    footer { margin-top: 24px; text-align: center; font-size: .75rem; opacity: .52; }
  </style>
</head>
<body>
<main>
  <h1>MARK</h1>
  <p class="sub">Conversa por voz no celular</p>
  <div id="orb" class="orb" aria-hidden="true"></div>
  <div id="state" class="state" role="status">Pronto para conversar</div>
  <p id="hint" class="hint">Aperte iniciar e permita o uso do microfone.</p>
  <div class="key">
    <label for="key">Chave de acesso do MARK</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Cole a chave usada no LocalMind">
  </div>
  <button id="toggle">Iniciar chamada</button>
  <button id="interrupt">Interromper e falar</button>
  <button id="replay">Tocar resposta</button>
  <footer>Conexão privada pelo Tailscale Serve (TLS 1.3 + ECDSA) · diga “pode descansar” para encerrar</footer>
</main>
<script>
(() => {
  const state = document.getElementById('state');
  const hint = document.getElementById('hint');
  const orb = document.getElementById('orb');
  const toggle = document.getElementById('toggle');
  const interrupt = document.getElementById('interrupt');
  const replay = document.getElementById('replay');
  const key = document.getElementById('key');
  key.value = sessionStorage.getItem('mark-call-key') || '';
  let active = false, phase = 'idle', stream, context, processor, source, playback, pending;
  let noise = .004, calibration = 0, above = 0, silent = 0, samples = [], pre = [], count = 0;
  let lastAudio = null;
  const setState = (title, detail, mode = '') => {
    state.textContent = title; hint.textContent = detail; orb.className = 'orb ' + mode;
  };
  const resetListening = () => {
    if (!active) return;
    phase = 'listening'; above = 0; silent = 0; samples = []; pre = []; count = 0;
    interrupt.style.display = 'none';
    setState('Ouvindo', 'Fale normalmente. MARK responderá pela saída de áudio do celular.', 'listening');
  };
  const concat = parts => {
    const length = parts.reduce((n, part) => n + part.length, 0);
    const output = new Float32Array(length); let at = 0;
    for (const part of parts) { output.set(part, at); at += part.length; }
    return output;
  };
  const pcm16k = input => {
    const rate = context.sampleRate, size = Math.ceil(input.length * 16000 / rate);
    const output = new Int16Array(size);
    for (let i = 0; i < size; i++) {
      const start = Math.floor(i * rate / 16000);
      const end = Math.min(input.length, Math.floor((i + 1) * rate / 16000));
      let sum = 0;
      for (let j = start; j < Math.max(start + 1, end); j++) sum += input[j] || 0;
      const value = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
      output[i] = value < 0 ? value * 32768 : value * 32767;
    }
    return output.buffer;
  };
  async function sendTurn(audio) {
    if (!active || phase !== 'listening') return;
    phase = 'processing'; setState('MARK pensando', 'Aguarde a resposta...', '');
    const abort = new AbortController(); pending = abort;
    try {
      const response = await fetch('/v1/voice/turn', {
        method: 'POST', signal: abort.signal,
        headers: {'Authorization': 'Bearer ' + key.value.trim(), 'Content-Type': 'application/octet-stream'},
        body: pcm16k(audio)
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error?.message || 'Erro HTTP ' + response.status);
      }
      const sleep = response.headers.get('X-Mark-Sleep') === '1';
      const wav = await response.arrayBuffer();
      if (!active) return;
      lastAudio = wav.slice(0); replay.style.display = 'none';
      await play(wav, sleep);
    } catch (error) {
      if (!active || error.name === 'AbortError') return;
      setState('Não consegui completar a fala', error.message || 'Tente novamente.', '');
      setTimeout(resetListening, 1800);
    } finally { if (pending === abort) pending = null; }
  }
  async function play(wav, sleep = false) {
    phase = 'speaking'; setState('MARK falando', 'Você pode ouvir pelo alto-falante ou fone do celular.', 'speaking');
    try {
      const decoded = await context.decodeAudioData(wav.slice(0));
      if (!active || phase !== 'speaking') return;
      playback = context.createBufferSource(); playback.buffer = decoded;
      playback.connect(context.destination);
      playback.onended = () => { playback = null; interrupt.style.display = 'none'; if (sleep) stop(); else resetListening(); };
      playback.start();
      interrupt.style.display = 'block';
    } catch (error) {
      interrupt.style.display = 'none';
      replay.style.display = 'block';
      setState('Toque para ouvir', 'O navegador bloqueou a reprodução automática.', '');
    }
  }
  function capture(event) {
    if (!active || phase !== 'listening') return;
    const frame = new Float32Array(event.inputBuffer.getChannelData(0));
    let power = 0; for (const x of frame) power += x * x;
    const rms = Math.sqrt(power / frame.length);
    if (calibration < 16) { noise = noise * .8 + rms * .2; calibration++; return; }
    const threshold = Math.max(.012, noise * 3.5);
    if (samples.length === 0) {
      pre.push(frame); if (pre.length > 9) pre.shift();
      above = rms > threshold ? above + 1 : 0;
      if (above >= 3) { samples = pre.slice(); count = samples.reduce((n, x) => n + x.length, 0); pre = []; silent = 0; }
      return;
    }
    samples.push(frame); count += frame.length;
    silent = rms < threshold ? silent + frame.length : 0;
    if (silent >= context.sampleRate * .45 || count >= context.sampleRate * 15) {
      const utterance = concat(samples); samples = []; pre = [];
      if (utterance.length >= context.sampleRate * .3) sendTurn(utterance);
      else resetListening();
    }
  }
  async function start() {
    if (!key.value.trim()) { setState('Falta a chave', 'Cole a mesma chave que você colocou no LocalMind.'); key.focus(); return; }
    if (!navigator.mediaDevices?.getUserMedia) { setState('Microfone indisponível', 'Abra esta página pelo endereço HTTPS do Tailscale.'); return; }
    try {
      sessionStorage.setItem('mark-call-key', key.value.trim());
      stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
      context = new AudioContext(); await context.resume();
      source = context.createMediaStreamSource(stream);
      processor = context.createScriptProcessor(2048, 1, 1);
      processor.onaudioprocess = capture;
      source.connect(processor); processor.connect(context.destination);
      active = true; calibration = 0; noise = .004;
      toggle.textContent = 'Encerrar chamada'; toggle.classList.add('active'); key.parentElement.style.display = 'none';
      resetListening();
    } catch (error) { setState('Não consegui abrir o microfone', 'Confira a permissão de microfone do navegador.'); stop(); }
  }
  function stop() {
    active = false; phase = 'idle'; pending?.abort(); pending = null;
    interrupt.style.display = 'none'; replay.style.display = 'none';
    if (playback) { playback.onended = null; try { playback.stop(); } catch (_) {} playback = null; }
    processor?.disconnect(); source?.disconnect(); stream?.getTracks().forEach(track => track.stop());
    context?.close(); processor = null; source = null; stream = null; context = null;
    toggle.textContent = 'Iniciar chamada'; toggle.classList.remove('active'); key.parentElement.style.display = '';
    setState('Chamada encerrada', 'Toque em iniciar para falar novamente.');
  }
  toggle.addEventListener('click', () => active ? stop() : start());
  interrupt.addEventListener('click', () => {
    if (!active || phase !== 'speaking' || !playback) return;
    playback.onended = null;
    try { playback.stop(); } catch (_) {}
    playback = null;
    resetListening();
  });
  replay.addEventListener('click', () => { if (active && lastAudio) { replay.style.display = 'none'; play(lastAudio); } });
  addEventListener('pagehide', stop);
})();
</script>
</body>
</html>
